name: Collect women's serve events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python scripts/collect_serve_events.py
      - name: Commit serve data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serve_events_2526.parquet
          if git diff --cached --quiet; then
            echo "No serve data changes"
          else
            git commit -m "Update women's serve event data"
            git push
          fi
